version: "1.17.0"

skills:
  install: all

hooks:
  deny-dangerous:
    enabled: true
  post-turn-safety:
    enabled: true
  gruff-code-quality:
    enabled: true
    # The cargo-run wrapper rebuilds from the worktree; target/release/gruff-rs changes only on an explicit release
    # build, so it can lag HEAD (scripts/preflight-checks.sh, search: MANAGED_DOC_DELTAS).
    binaries:
      rs: bin/gruff-rs
  deny-git-mutations:
    enabled: true
