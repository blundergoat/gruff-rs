# CI workflow for maintainers and contributors validating repository changes.
# A push or pull request runs the same dependency installer and preflight that
# developers use locally, with immutable action and Rust identities for trust.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CI_RUST_TOOLCHAIN: 1.100.1

jobs:
  verify:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable snapshot for Rust 1.100.1
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install dependency tools
        run: bash scripts/dependency-install.sh

      - name: Run checks
        run: bash scripts/preflight-checks.sh

  cross-platform:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable snapshot for Rust 1.100.1
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check build and test compilation
        run: cargo check --locked --all-targets

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cargo.toml's `rust-version` is the only copy of the promise, so this job cannot drift from it.
      - name: Read the declared minimum Rust version
        id: msrv
        run: printf 'version=%s\n' "$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable snapshot for Rust 1.100.1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Check build and test compilation on the declared minimum
        run: cargo check --locked --all-targets
