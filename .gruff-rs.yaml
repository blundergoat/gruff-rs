# gruff-rs default configuration.
#
# Generated by `gruff-rs init` from the built-in rule registry.
# Rule ids and metadata can be discovered with `gruff-rs rules`.
# Per-rule thresholds and severities can be tuned in place; see the
# README for the full configuration shape (paths, allowlists, rules,
# custom_rules, exclude, sensitiveExclusions).
#
# For an existing project, run `gruff-rs analyse --generate-baseline`
# to accept today's findings as the starting point.

schemaVersion: gruff-rs.config.v1

# Pinned to match the current binary default (advisory). The explicit pin
# freezes this project's CI behaviour against any future default flip.
failOn:
  analyse: advisory

deepScanBudget:
  enabled: true
  maxLines: 20000
  maxBytes: 2000000

paths:
  # Discovery-time do-not-read patterns. Use this for generated
  # build/vendor artifacts; use `gruff-rs analyse --generate-baseline`
  # or top-level `exclude` entries for accepted findings.
  ignore:
    - .agents/**
    - .antigravitycli/**
    - .claude/**
    - .codex/**
    - .github/**
    - .goat-flow/**
    - target/**
    - fixtures/**
    - tests/fixtures/**
    - node_modules/**
    - "**/Cargo.lock"
    - "**/package-lock.json"
    - "**/yarn.lock"
    - "**/pnpm-lock.yaml"

allowlists:
  # acceptedAbbreviations controls which short names naming.short-variable permits.
  # This configured list replaces (not merges) built-ins; keep these seeds and
  # append project vocabulary below.
  acceptedAbbreviations:
    - age
    - app
    - db
    - fs
    - id
    - io
    - key
    - log
    - max
    - min
    - now
    - raw
    - rx
    - tx
    - ui
    - url

# sensitiveExclusions suppresses reviewed sensitive-data findings, and only
# those. Each entry names one exact sensitive-data rule id, one project-
# relative path, an optional symbol, and a required reason; every entry
# reports its own suppressed count in `suppressions[]` and on text output.
# Write entries by hand: gruff-rs never converts a reported marker or preview
# into one, and no message- or value-matching key is accepted here.
# sensitiveExclusions:
#   - rule: sensitive-data.aws-access-key
#     path: tests/fixtures/aws-sample.env
#     reason: Synthetic key used by the loader fixture; not a live credential.

# The reviewed entries below belong to this repository's own dogfood scan only.
# `gruff-rs init` does not generate them, so no downstream project inherits them.
# Every scope names one sensitive-data rule and one Rust test file whose literal
# is synthetic calibration, renderer, or scenario material that the test needs in
# source; none is a live credential or real patient data. The detector stays
# unchanged and these paths stay out of `paths.ignore`, so a new secret in any of
# these files still reports under every other sensitive-data rule.
sensitiveExclusions:
  - rule: sensitive-data.api-key-pattern
    path: src/tests/calibration/security_size_test_waste_cases.rs
    reason: "Positive half of the sensitive-data.api-key-pattern calibration pair in `cases()`; a synthetic literal written into a temporary project to prove the rule fires, not a live credential."
  - rule: sensitive-data.aws-access-key
    path: src/tests/calibration/security_size_test_waste_cases.rs
    reason: "Positive half of the sensitive-data.aws-access-key calibration pair in `cases()`; a synthetic literal written into a temporary project to prove the rule fires, not a live credential."
  - rule: sensitive-data.database-url-password
    path: src/tests/calibration/security_size_test_waste_cases.rs
    reason: "Positive half of the sensitive-data.database-url-password calibration pair in `cases()`; a synthetic connection string that proves the rule fires, not a live credential."
  - rule: sensitive-data.gcp-service-account-key
    path: src/tests/calibration/security_size_test_waste_cases.rs
    reason: "Positive half of the sensitive-data.gcp-service-account-key calibration pair in `cases()`; a synthetic service-account body that proves the rule fires, not a live credential."
  - rule: sensitive-data.hardcoded-env-value
    path: src/tests/calibration/security_size_test_waste_cases.rs
    reason: "Positive half of the sensitive-data.hardcoded-env-value calibration pair in `cases()`; a synthetic KEY=value literal that proves the rule fires, not a live credential."
  - rule: sensitive-data.jwt-token
    path: src/tests/calibration/security_size_test_waste_cases.rs
    reason: "Positive half of the sensitive-data.jwt-token calibration pair in `cases()`; a synthetic token literal that proves the rule fires, not a live credential."
  - rule: sensitive-data.phi-pattern
    path: src/tests/calibration/security_size_test_waste_cases.rs
    reason: "Positive half of the sensitive-data.phi-pattern calibration pair in `cases()`; a synthetic health identifier that proves the rule fires, not real patient data."
  - rule: sensitive-data.url-embedded-credentials
    path: src/tests/calibration/security_size_test_waste_cases.rs
    reason: "Positive half of the sensitive-data.url-embedded-credentials calibration pair in `cases()`; a synthetic URL carrying placeholder credentials, not a live credential."
  - rule: sensitive-data.aws-access-key
    path: src/tests/config_and_selectors/sensitive_exclusions.rs
    reason: "Synthetic AWS sentinel written by `write_redaction_corpus`, kept byte-identical to the family redaction corpus so this suite can exercise the sensitiveExclusions contract; not a live credential."
  - rule: sensitive-data.api-key-pattern
    path: src/tests/renderers/sensitive_data.rs
    reason: "`FIXTURE_API_KEY` feeds `identity_independent_sensitive_report`; the renderer redaction contract needs the literal in source and it is not a live credential."
  - rule: sensitive-data.aws-access-key
    path: src/tests/renderers/sensitive_data.rs
    reason: "`FIXTURE_AWS_KEY` feeds `identity_independent_sensitive_report`; the renderer redaction contract needs the literal in source and it is not a live credential."
  - rule: sensitive-data.database-url-password
    path: src/tests/renderers/sensitive_data.rs
    reason: "`FIXTURE_DATABASE_URL` feeds `identity_independent_sensitive_report`; a synthetic connection string, not a live credential."
  - rule: sensitive-data.gcp-service-account-key
    path: src/tests/renderers/sensitive_data.rs
    reason: "Synthetic service-account bodies in `identity_independent_sensitive_report`, `sensitive_data_renderers_do_not_leak_new_secret_values`, and `reordered_service_account_key_is_still_reported`; none is a live credential."
  - rule: sensitive-data.hardcoded-env-value
    path: src/tests/renderers/sensitive_data.rs
    reason: "`FIXTURE_ENV_SECRET` rendered as a KEY=value literal in `identity_independent_sensitive_report`; a synthetic placeholder, not a live credential."
  - rule: sensitive-data.high-entropy-string
    path: src/tests/renderers/sensitive_data.rs
    reason: "Synthetic entropy sentinels `FIXTURE_PRIVATE_KEY_BODY` and `FIXTURE_ENTROPY_SECRET`, plus the literal the leak assertion compares against; renderer tests need them in source and none is a live credential."
  - rule: sensitive-data.jwt-token
    path: src/tests/renderers/sensitive_data.rs
    reason: "`FIXTURE_JWT` feeds `identity_independent_sensitive_report`; a synthetic token literal, not a live credential."
  - rule: sensitive-data.phi-pattern
    path: src/tests/renderers/sensitive_data.rs
    reason: "Synthetic MRN literals in `identity_independent_sensitive_report` and `sensitive_data_renderers_do_not_leak_new_secret_values`; placeholder identifiers, not real patient data."
  - rule: sensitive-data.private-key
    path: src/tests/renderers/sensitive_data.rs
    reason: "Synthetic PEM marker in `reordered_service_account_key_is_still_reported`, which proves an unmatched service-account key is still reported; not a live key."
  - rule: sensitive-data.url-embedded-credentials
    path: src/tests/renderers/sensitive_data.rs
    reason: "`FIXTURE_HTTP_URL` feeds `identity_independent_sensitive_report`; a synthetic URL carrying placeholder credentials, not a live credential."
  - rule: sensitive-data.api-key-pattern
    path: src/tests/rule_behaviours/false_positive_guards.rs
    reason: "Synthetic token-shaped literal in `high_entropy_string_keeps_real_secret_shapes`; the guard needs one real secret shape to prove the integrity-hash skip is scoped, and the value is not a live credential."
  - rule: sensitive-data.high-entropy-string
    path: src/tests/rule_behaviours/false_positive_guards.rs
    reason: "Synthetic secret-shaped literals in the `high_entropy_string_*` guards, which prove the rule still fires beside integrity hashes, base64 alphabets, and model identifiers; none is a live credential."
  - rule: sensitive-data.api-key-pattern
    path: src/tests/scenarios/calibration_extras.rs
    reason: "Synthetic vendor-token placeholders in `calibration_api_key_pattern_detects_common_formats`; each proves one provider format is recognised and none is a live credential."
  - rule: sensitive-data.database-url-password
    path: src/tests/scenarios/calibration_extras.rs
    reason: "Synthetic postgres connection strings in the hardcoded-env-value and security calibration probes; placeholder credentials, not live database passwords."
  - rule: sensitive-data.high-entropy-string
    path: src/tests/scenarios/calibration_extras.rs
    reason: "Synthetic DATABASE_PASSWORD placeholders in `calibration_hardcoded_env_value_skips_test_fixture_strings` that also trip the entropy heuristic; not live credentials."
  - rule: sensitive-data.url-embedded-credentials
    path: src/tests/scenarios/calibration_extras.rs
    reason: "Synthetic URL carrying placeholder credentials in the security calibration probe; not a live credential."
  - rule: sensitive-data.aws-access-key
    path: src/tests/scenarios/diff/hook.rs
    reason: "Synthetic AWS sentinel written by `write_secret_oversized_rust_file` and `write_aws_key_file` into temporary hook-diff projects; it drives duplicate-identity counting and is not a live credential."
  - rule: sensitive-data.aws-access-key
    path: src/tests/scenarios/smoke.rs
    reason: "Synthetic AWS sentinel in the bounded-source and deep-scan-budget smoke fixtures; it proves text safety survives the budget boundary and is not a live credential."

rules:
  # Flags modules with more indexed items than the configured threshold.
  architecture.large-module:
    enabled: true
    threshold: 25
    severity: advisory
  # Flags files that declare many child modules.
  architecture.module-fan-out:
    enabled: true
    threshold: 8
    severity: advisory
  # Flags modules with many public exports.
  architecture.public-api-surface:
    enabled: true
    threshold: 12
    severity: advisory
  # Flags GitHub event values interpolated directly into workflow or composite-action shell steps.
  ci.github-event-shell-interpolation:
    enabled: true
  # Flags functions with high cognitive complexity.
  complexity.cognitive:
    enabled: true
    threshold: 15
    severity: warning
  # Flags functions with high branch and decision complexity.
  complexity.cyclomatic:
    enabled: true
    threshold: 10
    severity: warning
  # Flags functions with deeply nested control flow.
  complexity.nesting-depth:
    enabled: true
    threshold: 4
    severity: warning
  # Flags narrow blocking call patterns inside async functions.
  concurrency.blocking-call-in-async:
    enabled: true
  # Flags lock guard bindings that appear to live across an await point.
  concurrency.lock-across-await:
    enabled: true
  # Flags unbounded channel constructors in production code.
  concurrency.unbounded-channel:
    enabled: true
  # Flags private functions with no same-file call sites.
  dead-code.unused-private-function:
    enabled: true
  # Flags private items whose names are not referenced elsewhere in discovered Rust sources.
  dead-code.unused-private-item-candidate:
    enabled: true
  # Flags packages locked at more versions than the configured threshold.
  dependency.duplicate-locked-version:
    enabled: true
    threshold: 2
    severity: advisory
  # Flags dependencies sourced directly from git repositories.
  dependency.git-source:
    enabled: true
  # Flags git dependencies that do not pin a fixed rev.
  dependency.git-unpinned-revision:
    enabled: true
  # Flags packages missing description or license metadata.
  dependency.missing-package-metadata:
    enabled: true
  # Flags dependencies sourced from local filesystem paths.
  dependency.path-source:
    enabled: true
  # Flags dependency requirements that use wildcard versions.
  dependency.wildcard-version:
    enabled: true
  # Flags comments whose payload looks like a disabled Rust statement or item.
  docs.commented-out-code:
    enabled: true
  # Flags externally public functions returning Result without a # Errors rustdoc section.
  docs.missing-errors-section:
    enabled: true
  # Flags public functions containing panic!/unwrap/expect without a # Panics rustdoc section.
  docs.missing-panics-section:
    enabled: true
  # Flags public functions whose rustdoc lacks per-parameter documentation.
  docs.missing-param-doc:
    enabled: true
  # Flags public Rust API items without doc comments.
  docs.missing-public-doc:
    enabled: true
  # Flags projects without a root README file.
  docs.missing-readme:
    enabled: true
  # Flags public functions returning a value whose rustdoc lacks a Returns description.
  docs.missing-return-doc:
    enabled: true
  # Flags public `unsafe fn` / `unsafe trait` items without a # Safety rustdoc section.
  docs.missing-safety-section:
    enabled: true
  # Flags TODO/FIXME/HACK/XXX comments without an owner, issue reference, or reason.
  docs.stale-todo:
    enabled: true
  # Flags unsafe blocks whose nearby SAFETY: rationale is too short or vague.
  docs.weak-safety-rationale:
    enabled: true
  # Flags panic! calls in non-test functions without a local invariant comment.
  error-handling.production-panic:
    enabled: true
  # Flags unwrap or expect calls in public non-test functions.
  error-handling.public-unwrap:
    enabled: true
  # Flags todo! and unimplemented! placeholders in non-test functions.
  error-handling.unimplemented-placeholder:
    enabled: true
  # Flags `iter().any(|x| *x == y)` patterns that should use `.contains(&y)`.
  modernisation.manual-contains:
    enabled: true
  # Flags `len() == 0` and `len() != 0` comparisons that should use `is_empty()`.
  modernisation.manual-is-empty:
    enabled: true
  # Flags `if s.starts_with(p) { &s[p.len()..] }` shapes that should use `strip_prefix`.
  modernisation.manual-strip-prefix:
    enabled: true
  # Flags `match opt { Some(v) => v, None => Default::default() }` shapes that should use `unwrap_or_default()`.
  modernisation.manual-unwrap-or-default:
    enabled: true
  # Flags manual `match`/`if let Err` Result-propagation shapes that should use `?`.
  modernisation.question-mark-candidate:
    enabled: true
  # Flags bool-returning functions whose names do not read like predicates.
  naming.boolean-prefix:
    enabled: true
  # Flags function names that are too generic to explain intent.
  naming.generic-function:
    enabled: true
  # Flags `let X = X(...)` bindings that shadow a same-file free function.
  naming.identifier-shadow:
    enabled: true
  # Flags placeholder identifiers such as foo, bar, baz, and qux.
  naming.placeholder-identifier:
    enabled: true
  # Flags two-letter `let` bindings and function parameters outside accepted
  # abbreviations, except conventional typed `cx` context parameters.
  naming.short-variable:
    enabled: true
  # Flags clone calls inside loop bodies as allocation hot spot candidates.
  performance.clone-in-loop:
    enabled: true
  # Flags format! calls inside loop bodies as allocation hot spot candidates.
  performance.format-in-loop:
    enabled: true
  # Flags Regex::new calls inside loop bodies.
  performance.regex-in-loop:
    enabled: true
  # Flags workflow-level scoped writes and permissions: write-all grants.
  security.github-actions-broad-permissions:
    enabled: true
  # Flags pull_request_target workflows for manual secret and checkout review.
  security.github-actions-pull-request-target:
    enabled: true
  # Flags GitHub Actions shell steps that pipe remote downloads into an interpreter.
  security.github-actions-remote-shell:
    enabled: true
  # Flags pull request workflows that reference repository secrets.
  security.github-actions-secrets-in-pr:
    enabled: true
  # Flags third-party workflow or composite-action dependencies that are not pinned to a full commit SHA.
  security.github-actions-unpinned-action:
    enabled: true
  # Flags all-interface listener literals in executable Rust, including tests and CI helpers.
  security.hardcoded-bind-all-interfaces:
    enabled: true
  # Flags non-cryptographic rand calls inside secret-like generation functions.
  security.insecure-rng-for-secrets:
    enabled: true
  # Flags filesystem path construction where externally-derived input is joined without normalisation.
  security.path-traversal-candidate:
    enabled: true
  # Flags process command construction for manual argument validation.
  security.process-command:
    enabled: true
  # Flags direct dynamic SQL query arguments such as query(format!(...)).
  security.sql-dynamic-query:
    enabled: true
  # Flags request URLs derived from local input without nearby allow-list evidence.
  security.ssrf-candidate:
    enabled: true
  # Flags HTML/template output that includes request-derived values without local escaping evidence.
  security.template-injection-xss:
    enabled: true
  # Flags explicit TLS certificate or hostname verification bypasses.
  security.tls-verification-disabled:
    enabled: true
  # Flags unsafe blocks without a nearby SAFETY rationale.
  security.unsafe-block:
    enabled: true
  # Flags YAML or binary deserialization of data derived from local input.
  security.unsafe-deserialization:
    enabled: true
  # Flags explicit weak cryptographic primitive imports or constructors for review.
  security.weak-crypto:
    enabled: true
  # Flags XML parser options that enable external entity or DTD resolution.
  security.xxe-candidate:
    enabled: true
  # Flags common API key patterns.
  sensitive-data.api-key-pattern:
    enabled: true
  # Flags AWS access key patterns.
  sensitive-data.aws-access-key:
    enabled: true
  # Flags database URLs that appear to include passwords.
  sensitive-data.database-url-password:
    enabled: true
  # Flags committed GCP service-account private key material.
  sensitive-data.gcp-service-account-key:
    enabled: true
  # Flags secret-like KEY=value literals committed in source or config.
  sensitive-data.hardcoded-env-value:
    enabled: true
  # Flags long string literals that look like generated secrets.
  sensitive-data.high-entropy-string:
    enabled: true
  # Flags JWT-looking token strings.
  sensitive-data.jwt-token:
    enabled: true
  # Flags SSN, MRN, and Medicare-style health identifiers with redacted previews.
  sensitive-data.phi-pattern:
    enabled: true
  # Flags realistic emails, SSN-shaped strings, or US phone numbers in fixture or sample files.
  sensitive-data.pii-test-fixture:
    enabled: true
  # Flags private key block markers.
  sensitive-data.private-key:
    enabled: true
  # Flags HTTP(S) URLs that include embedded username and password credentials.
  sensitive-data.url-embedded-credentials:
    enabled: true
  # Flags files whose substantive line count exceeds the configured threshold.
  size.file-length:
    enabled: true
    threshold: 1000
    severity: error
  # Flags functions over the configured line-count threshold.
  size.function-length:
    enabled: true
    threshold: 50
    severity: warning
  # Flags functions with too many parameters.
  size.parameter-count:
    enabled: true
    threshold: 7
    severity: warning
  # Flags tests that contain conditional logic.
  test-quality.conditional-logic:
    enabled: true
  # Flags ignored tests that do not explain why they are skipped.
  test-quality.ignored-without-reason:
    enabled: true
  # Flags long test functions that are harder to scan and maintain.
  test-quality.long-test:
    enabled: true
    threshold: 120
    severity: advisory
  # Flags `#[should_panic]` attributes without an `expected = "..."` clause.
  test-quality.should-panic-without-expected:
    enabled: true
  # Flags tests that sleep instead of synchronizing on behavior.
  test-quality.sleep-in-test:
    enabled: true
  # Flags assertions that prove a value the code already fixes instead of behavior: literal tautologies (`assert!(true)`, `assert_eq!(1, 1)`) and an immutable literal binding asserted against its own value (`let x = 5; assert_eq!(x, 5)`).
  test-quality.trivial-assertion:
    enabled: true
  # Opt-in style check for unwrap calls in tests.
  test-quality.unwrap-in-test:
    enabled: false
  # Flags clone calls that may be avoidable.
  waste.unnecessary-clone-candidate:
    enabled: false
  # Flags statements after terminating statements.
  waste.unreachable-code:
    enabled: true
  # Flags unwrap and expect calls outside test attributes.
  waste.unwrap-expect:
    enabled: true
