# Codex CLI config template - copy to .codex/config.toml
#
# Key differences from Claude Code:
# - This file enables the hooks engine with the current Codex feature flag
# - Filesystem allow/deny policy uses Codex permission profiles, not Claude's
#   settings.json permissions.allow/permissions.deny syntax
# - Hook registrations live in .codex/hooks.json for goat-flow installs
# - The shipped codex-hooks.json template registers Bash-matched guardrail hooks
# - Command deny policy still lives in those PreToolUse hooks because
#   Codex permission profiles describe filesystem/network access, not shell
#   command pattern denies like git push or sudo
default_permissions = "goat-flow"

[features]
hooks = true

[permissions.goat-flow]
description = "goat-flow workspace editing with secret-path read denies."
extends = ":workspace"

[permissions.goat-flow.filesystem]
glob_scan_max_depth = 3

[permissions.goat-flow.filesystem.":workspace_roots"]
# Deny rules win over allow/read rules on both Codex and Claude, so a broad
# .env* deny cannot be re-opened for the sample file. Real env variants are
# denied individually so .env.example stays readable, matching the Bash deny
# hook; nonstandard variants (e.g. .env.backup) are covered by that hook.
# Rules match secret content shapes and credential stores, never plain folder
# or file names such as secrets/ or credentials*, which collide with ordinary
# application code. The Bash deny hook covers shell access to home stores.
"**/.env" = "deny"
"**/.env.local" = "deny"
"**/.env.development" = "deny"
"**/.env.production" = "deny"
"**/.env.staging" = "deny"
"**/.env.test" = "deny"
"**/.envrc" = "deny"
"**/.env.*.local" = "deny"
"**/.ssh/**" = "deny"
"**/.aws/**" = "deny"
"**/.gnupg/**" = "deny"
"**/.config/gcloud/**" = "deny"
"**/.docker/**" = "deny"
"**/.kube/**" = "deny"
"**/.npmrc" = "deny"
"**/.netrc" = "deny"
"**/.git-credentials" = "deny"
"**/.config/gh/hosts.yml" = "deny"
"**/.pgpass" = "deny"
"**/.pypirc" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"
"**/*.pfx" = "deny"
