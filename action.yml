# Composite action entry point for workflow authors running gruff-rs in CI.
# Use it to install one exact release, analyse a workspace, and optionally save
# the report for a later upload step without parsing user input as shell code.
name: gruff-rs
description: Run the gruff-rs quality analyzer on a Rust project.
author: gruff-rs contributors
branding:
  icon: shield
  color: green

inputs:
  version:
    description: |
      Exact gruff-rs X.Y.Z release version to install. When omitted, the version is
      inferred only from an exact action tag such as `v0.5.0`. Callers pinning
      this action by full commit SHA must pass the matching version explicitly.
    required: false
    default: ""
  args:
    description: |
      Deprecated. Any non-empty value fails closed; migrate to argv.
    required: false
    default: ""
  argv:
    description: |
      Arguments passed to gruff-rs, one literal argument per non-empty line.
      Spaces inside a line are preserved as part of that argument.
    required: false
    default: |
      analyse
      .
      --format
      sarif
      --fail-on
      warning
      --no-baseline
  working-directory:
    description: Directory the analyzer is invoked from.
    required: false
    default: ""
  output-file:
    description: |
      Optional path to write the analyzer stdout to. When set the action
      redirects stdout to this file (useful for piping SARIF to a follow-up
      `upload-sarif` step).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve version
      id: version
      shell: bash
      env:
        GRUFF_INPUT_VERSION: ${{ inputs.version }}
        GRUFF_ACTION_REF: ${{ github.action_ref }}
      run: '"$GITHUB_ACTION_PATH/scripts/action-run.sh" resolve-version'

    - name: Install gruff-rs
      shell: bash
      env:
        GRUFF_RESOLVED_VERSION: ${{ steps.version.outputs.value }}
      run: '"$GITHUB_ACTION_PATH/scripts/action-install.sh"'

    - name: Run gruff-rs
      shell: bash
      env:
        GRUFF_INPUT_ARGS: ${{ inputs.args }}
        GRUFF_INPUT_ARGV: ${{ inputs.argv }}
        GRUFF_INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        GRUFF_INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
      run: '"$GITHUB_ACTION_PATH/scripts/action-run.sh" run'
